name: Signed DSH plugin catalog

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: plugin-catalog-pages
  cancel-in-progress: true

jobs:
  catalog:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Generate and sign catalog
        env:
          SAI_CATALOG_ED25519_PRIVATE_KEY: ${{ secrets.SAI_CATALOG_ED25519_PRIVATE_KEY }}
        run: node scripts/generate-catalog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog
      - id: deployment
        uses: actions/deploy-pages@v4

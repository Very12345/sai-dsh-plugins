name: Plugin release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run pack:all
      - name: Checksums
        run: cd dist && sha256sum *.tgz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
